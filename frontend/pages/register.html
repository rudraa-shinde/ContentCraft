<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ContentCraft — Register</title>
<link rel="stylesheet" href="../css/style.css"/>
<script src="../js/script.js"></script>
</head>
<body>
<div class="bg-grid"></div>
<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="auth-wrap">
  <div class="card" style="width:440px;">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <span class="logo-text">ContentCraft</span>
    </div>
    <h1>Create account</h1>
    <p class="subtitle">Join and start creating AI-powered content</p>
    <!-- Benefits -->
    <div style="display:flex;gap:10px;margin-bottom:22px;">
      <div style="flex:1;background:rgba(0,245,160,0.04);border:1px solid rgba(0,245,160,0.12);border-radius:10px;padding:10px;text-align:center;">
        <div style="font-size:18px;margin-bottom:3px;">⚡</div>
        <div style="font-size:10px;color:var(--muted);">AI Generation</div>
      </div>
      <div style="flex:1;background:rgba(0,245,160,0.04);border:1px solid rgba(0,245,160,0.12);border-radius:10px;padding:10px;text-align:center;">
        <div style="font-size:18px;margin-bottom:3px;">📊</div>
        <div style="font-size:10px;color:var(--muted);">Content Score</div>
      </div>
      <div style="flex:1;background:rgba(0,245,160,0.04);border:1px solid rgba(0,245,160,0.12);border-radius:10px;padding:10px;text-align:center;">
        <div style="font-size:18px;margin-bottom:3px;">🌐</div>
        <div style="font-size:10px;color:var(--muted);">Multi Language</div>
      </div>
    </div>

    <div class="alert error"   id="errorMsg"></div>
    <div class="alert success" id="successMsg"></div>

    <div class="field">
      <label>Full Name</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="name" placeholder="Your full name"/>
      </div>
    </div>
    <div class="field">
      <label>Email Address</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        <input type="email" id="email" placeholder="you@example.com"/>
      </div>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" placeholder="Min 8 characters" oninput="checkStrength(this.value)"/>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="strength-label" id="strengthLabel">Enter a password</div>
    </div>
    <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;">
      <input type="checkbox" id="terms" style="width:15px;height:15px;accent-color:var(--accent);margin-top:2px;padding:0;background:transparent;border:none;box-shadow:none;"/>
      <span style="font-size:12px;color:var(--muted);">I agree to the <a href="#" style="color:var(--accent);">Terms</a> and <a href="#" style="color:var(--accent);">Privacy Policy</a></span>
    </div>
    <button class="btn btn-primary" id="registerBtn" onclick="handleRegister()">Create Account</button>
    <div class="divider">or</div>
    <div class="bottom-link">Already have an account? <a href="login.html">Sign in</a></div>
  </div>
</div>

<script src="/js/script.js"></script>
<script>
async function handleRegister(){
  const name     = document.getElementById('name').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const agreed   = document.getElementById('terms').checked;
  hideAlerts();
  if(!name||!email||!password){ showAlert('error','⚠️ Please fill in all fields.'); return; }
  if(password.length < 8)      { showAlert('error','⚠️ Password must be at least 8 characters.'); return; }
  if(!agreed)                   { showAlert('error','⚠️ Please agree to the Terms.'); return; }
  setLoading('registerBtn','Creating account...');
  try{
    const res  = await fetch(`${API}/api/auth/register`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,email,password})
    });
    const data = await res.json();
    if(res.ok){
      showAlert('success','🎉 Account created! Redirecting to login...');
      setTimeout(()=> window.location.href='login.html', 1500);
    } else {
      showAlert('error','❌ '+(data.error||'Registration failed.'));
    }
  }catch{
    showAlert('error','❌ Server error. Make sure Flask is running on port 5000.');
  }finally{
    clearLoading('registerBtn');
  }
}
</script>
</body>
</html>
