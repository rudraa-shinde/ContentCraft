<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ContentCraft — Dashboard</title>
<link rel="stylesheet" href="../css/style.css"/>
<script src="../js/script.js"></script>
</head>
<body>
<div class="bg-grid"></div>
<div class="blob blob1"></div>
<div class="blob blob2"></div>

<aside class="sidebar">
  <div class="logo">
    <div class="logo-icon">✦</div>
    <span class="logo-text">ContentCraft</span>
  </div>
  <div class="nav-label">Menu</div>
  <a class="nav-item active" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Dashboard
  </a>
  <a class="nav-item" href="history.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    History
  </a>
  <div class="sidebar-bottom">
    <div class="user-card">
      <div class="user-avatar" id="avatarLetter">U</div>
      <div>
        <div class="user-name" id="sidebarName">User</div>
        <div class="user-plan">Free Plan</div>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div>
      <div class="page-title">Dashboard</div>
      <div class="page-sub">Generate, score and analyze your content</div>
    </div>
    <span class="badge">✦ AI Powered</span>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="stat-icon">📝</div><div class="stat-value" id="totalStat">0</div><div class="stat-label">Generated</div></div>
    <div class="stat-card"><div class="stat-icon">⚡</div><div class="stat-value">4</div><div class="stat-label">Platforms</div></div>
    <div class="stat-card"><div class="stat-icon">🌐</div><div class="stat-value">3</div><div class="stat-label">Languages</div></div>
    <div class="stat-card"><div class="stat-icon">🎯</div><div class="stat-value">5</div><div class="stat-label">Metrics</div></div>
  </div>

  <div class="panel">
    <div class="panel-title">⚡ Generate Content</div>
    <div class="panel-sub">Fill in details and let AI do the work</div>
    <div class="alert error" id="errorMsg"></div>
    <div class="form-grid">
      <div class="field">
        <label>Content Type</label>
        <select id="contentType">
          <option value="caption">Instagram Caption</option>
          <option value="script">YouTube Script</option>
          <option value="tweet">Tweet</option>
          <option value="blog">Blog Intro</option>
          <option value="ad">Ad Copy</option>
        </select>
      </div>
      <div class="field">
        <label>Tone</label>
        <select id="tone">
          <option value="professional">Professional</option>
          <option value="casual">Casual</option>
          <option value="humorous">Humorous</option>
          <option value="inspirational">Inspirational</option>
        </select>
      </div>
      <div class="field">
        <label>Language</label>
        <select id="language">
          <option value="english">English</option>
          <option value="hindi">Hindi</option>
          <option value="hinglish">Hinglish</option>
        </select>
      </div>
      <div class="field">
        <label>Platform</label>
        <select id="platformSelect">
          <option value="instagram">Instagram</option>
          <option value="youtube">YouTube</option>
          <option value="twitter">Twitter/X</option>
          <option value="linkedin">LinkedIn</option>
        </select>
      </div>
      <div class="field full">
        <label>Topic / Idea</label>
        <textarea id="topic" placeholder="e.g. Tips for productivity, my product launch..."></textarea>
      </div>
    </div>
    <button class="btn btn-primary" id="genBtn" onclick="generateContent()">⚡ Generate Content</button>
  </div>

  <div class="panel output-panel" id="outputPanel">
    <div class="output-header">
      <div class="output-title">✨ Generated Content</div>
      <div class="output-actions">
        <button class="btn btn-ghost" onclick="copyText(generatedContent, this)">📋 Copy</button>
        <button class="btn btn-ghost" onclick="analyzeScore()">📊 Score</button>
        <button class="btn btn-ghost" onclick="analyzeTone()">🎭 Tone</button>
      </div>
    </div>
    <div class="output-text" id="outputText"></div>
    <div id="scoresSection" style="display:none">
      <div class="panel-title" style="margin-top:18px;font-size:14px;">📊 Content Score</div>
      <div class="scores-grid" id="scoresGrid"></div>
    </div>
    <div id="toneSection" style="display:none">
      <div class="panel-title" style="margin-top:18px;font-size:14px;">🎭 Tone Analysis</div>
      <div class="tone-grid" id="toneGrid"></div>
    </div>
  </div>
</main>

<script src="/js/script.js"></script>
<script>
let generatedContent = '';

window.onload = () => {
  authGuard();
  initSidebar();
  loadStats();
  // reuse from history
  const reuse = localStorage.getItem('reuse');
  if(reuse){
    const r = JSON.parse(reuse);
    document.getElementById('topic').value          = r.topic    || '';
    document.getElementById('contentType').value    = r.type     || 'caption';
    document.getElementById('platformSelect').value = r.platform || 'instagram';
    document.getElementById('tone').value           = r.tone     || 'professional';
    document.getElementById('language').value       = r.language || 'english';
    localStorage.removeItem('reuse');
  }
};

async function loadStats(){
  try{
    const res  = await fetch(`${API}/api/content/history?user_id=${getUserId()}`);
    const data = await res.json();
    document.getElementById('totalStat').textContent = data.history?.length || 0;
  }catch{}
}

async function generateContent(){
  const topic = document.getElementById('topic').value.trim();
  hideAlerts();
  if(!topic){ showAlert('error','⚠️ Please enter a topic.'); return; }

  setLoading('genBtn','Generating...');
  document.getElementById('scoresSection').style.display = 'none';
  document.getElementById('toneSection').style.display   = 'none';

  try{
    const res  = await fetch(`${API}/api/content/generate`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${getToken()}`},
      body:JSON.stringify({
        type:     document.getElementById('contentType').value,
        topic,
        tone:     document.getElementById('tone').value,
        platform: document.getElementById('platformSelect').value,
        language: document.getElementById('language').value,
        user_id:  getUserId()
      })
    });
    const data = await res.json();
    if(res.ok){
      generatedContent = data.output;
      document.getElementById('outputText').textContent = data.output;
      document.getElementById('outputPanel').style.display = 'block';
      document.getElementById('outputPanel').scrollIntoView({behavior:'smooth'});
      loadStats();
    } else {
      showAlert('error','❌ '+(data.error||'Generation failed.'));
    }
  }catch{
    showAlert('error','❌ Server error. Make sure Flask is running.');
  }finally{
    clearLoading('genBtn');
  }
}

async function analyzeScore(){
  if(!generatedContent) return;
  try{
    const res  = await fetch(`${API}/api/content/score`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        content:  generatedContent,
        type:     document.getElementById('contentType').value,
        platform: document.getElementById('platformSelect').value
      })
    });
    const data = await res.json();
    if(res.ok) renderScores(data.scores);
  }catch{}
}

async function analyzeTone(){
  if(!generatedContent) return;
  try{
    const res  = await fetch(`${API}/api/content/analyze-tone`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({content: generatedContent})
    });
    const data = await res.json();
    if(res.ok) renderTone(data.analysis);
  }catch{}
}
</script>
</body>
</html>
